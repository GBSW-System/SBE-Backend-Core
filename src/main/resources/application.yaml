spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: SBackEnd
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      decision: none
      audio:
        speech: none
        transcription: none
  webservices:
    path: /soap
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sbe}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:1234}"
    driver-class-name: org.postgresql.Driver

sbe:
  grpc:
    host: "${SBE_GRPC_HOST:127.0.0.1}"
    port: "${SBE_GRPC_PORT:50051}"
