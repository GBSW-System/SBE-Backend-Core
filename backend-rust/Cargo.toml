[package]
name = "sbe-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
argon2 = "0.5"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.27"
crossbeam = "0.8.5"
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures = "0.3.34"
hmac = "0.13.0"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
mime = "0.3.18"
moka = { version = "0.12.16", features = ["future"] }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.33.1"
parking_lot = "0.13.0"
prost = "0.14"
prost-types = "0.14"
rand = "0.10.4"
rayon = "1.12.0"
redis = { version = "1.8.3", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "macros", "migrate", "chrono", "json", "uuid"] }
subtle = "2.6.1"
sysinfo = "0.40.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tower = { version = "0.5.3", features = ["limit", "timeout", "buffer", "load-shed", "retry", "util"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4", "v7", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
zeroize = "1.9.2"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
mockall = "0.15.0"
proptest = "1.12.0"
tempfile = "3.27.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["mysql"] }
wiremock = "0.6.5"
